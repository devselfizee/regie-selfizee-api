name: regie-selfizee

# Production (Coolify) : la base PostgreSQL est une ressource Coolify séparée,
# fournie par DATABASE_URL. Pour une base locale, voir docker-compose.local.yml.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3003
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      TVA_DEFAUT_BP: ${TVA_DEFAUT_BP:-2000}
      INGEST_BODY_LIMIT: ${INGEST_BODY_LIMIT:-2mb}
    ports:
      - "${API_PORT:-3003}:3003"
